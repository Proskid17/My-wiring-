<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agumba limited.ng</title>
    <style>
        body { font-family: 'Arial', sans-serif; text-align: center; background-color: #ffffff; padding: 20px; margin: 0; }
        h1 { color: #004a99; font-size: 2.5rem; margin-top: 20px; }
        .product-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; margin-top: 40px; }
        .card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 20px; width: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        img { width: 100%; height: 220px; object-fit: cover; border-radius: 5px; }
        .price { font-size: 24px; font-weight: bold; color: #333; margin: 15px 0; display: block; }
        .buy-btn { 
            background-color: #25D366; 
            color: white; 
            text-decoration: none; 
            padding: 15px 0; 
            border-radius: 5px; 
            font-weight: bold; 
            display: block; 
            font-size: 18px;
            transition: 0.3s;
        }
        .buy-btn:hover { background-color: #128C7E; }
    </style>
</head>
<body>

    <h1>Agumba limited.ng</h1>

    <div class="product-container">
        <div class="card">
            <img src="rebar.png" alt="Steel Rebar">
            <span class="price">₦12,000</span>
            <a href="https://wa.me/2348033405273?text=Hello%20Agumba%20Limited,%20I%20am%20interested%20in%20the%20Steel%20Rebar" class="buy-btn">BUY</a>
        </div>

        <div class="card">
            <img src="wire.png" alt="Galvanized Wire">
            <span class="price">₦32,000</span>
            <a href="https://wa.me/2348033405273?text=Hello%20Agumba%20Limited,%20I%20am%20interested%20in%20the%20Galvanized%20Wire" class="buy-btn">BUY</a>
        </div>

        <div class="card">
            <img src="cement.png" alt="Dangote Cement">
            <span class="price">₦12,000</span>
            <a href="https://wa.me/2348033405273?text=Hello%20Agumba%20Limited,%20I%20am%20interested%20in%20the%20Dangote%20Cement" class="buy-btn">BUY</a>
        </div>
    </div>

</body>
</html>
