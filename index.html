<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agumba limited.ng</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f4; padding: 10px; margin: 0; }
        h1 { color: #004a99; font-size: 24px; margin: 20px 0; }
        .container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 15px; width: 90%; max-width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .product-name { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 10px; display: block; }
        .img-box { width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; background: #fff; margin-bottom: 10px; }
        img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .price { font-size: 28px; font-weight: 900; color: #000; margin: 15px 0; display: block; }
        .buy-btn { 
            background-color: #5cb85c; 
            color: white; 
            text-decoration: none; 
            padding: 15px 0; 
            border-radius: 8px; 
            font-weight: bold; 
            display: block; 
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h1>Agumba limited.ng</h1>

    <div class="container">
        <div class="card">
            <span class="product-name">Steel Rebar</span>
            <div class="img-box"><img src="https://i.postimg.cc/8zQzXmBv/rebar.png"></div>
            <span class="price">₦12,000</span>
            <a href="https://wa.me/2348033405273?text=I%20want%20to%20buy%20Steel%20Rebar" class="buy-btn">BUY</a>
        </div>

        <div class="card">
            <span class="product-name">Galvanized Wire</span>
            <div class="img-box"><img src="https://i.postimg.cc/mD8p6m6P/wire.png"></div>
            <span class="price">₦32,000</span>
            <a href="https://wa.me/2348033405273?text=I%20want%20to%20buy%20Galvanized%20Wire" class="buy-btn">BUY</a>
        </div>

        <div class="card">
            <span class="product-name">Dangote Cement</span>
            <div class="img-box"><img src="https://i.postimg.cc/9f0X98Lp/cement.png"></div>
            <span class="price">₦12,000</span>
            <a href="https://wa.me/2348033405273?text=I%20want%20to%20buy%20Dangote%20Cement" class="buy-btn">BUY</a>
        </div>
    </div>

</body>
</html>
